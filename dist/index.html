    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <body>
    <div id="root"></div>
    <script>
function renderPreviewList() {
  const list = document.getElementById('previewList');
  if (!activePlan) return;
  list.innerHTML = activePlan.steps.map((s, idx) => {
    const STEPS_PER_DAY = 3;
    const dayNum        = Math.floor(idx / STEPS_PER_DAY) + 1;
    const currentDayStart = Math.floor(currentRoadmapIndex / STEPS_PER_DAY) * STEPS_PER_DAY;
    const stepDayStart    = Math.floor(idx / STEPS_PER_DAY) * STEPS_PER_DAY;
    const isLocked        = stepDayStart > currentDayStart;
    const isComplete      = idx < currentRoadmapIndex;
    const isCurrent       = !isComplete && !isLocked;

    return `
      <div style="
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 14px;
        margin-bottom: 8px;
        opacity: ${isLocked ? '0.45' : '1'};
        background: ${isCurrent ? '#eff6ff' : isComplete ? '#f0fdf4' : '#fafafa'};
        border: 1.5px solid ${isCurrent ? '#bfdbfe' : isComplete ? '#bbf7d0' : '#f0f0f0'};
        transition: all .2s;
      ">
        <!-- Icon Circle -->
        <div style="
          width: 36px;
          height: 36px;
          border-radius: 50%;
          flex-shrink: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 16px;
          background: ${isCurrent ? '#dbeafe' : isComplete ? '#dcfce7' : '#f0f0f0'};
        ">${isComplete ? '✅' : isCurrent ? '📍' : '🔒'}</div>

        <!-- Content -->
        <div style="flex: 1; min-width: 0;">
          <div style="
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
          ">
            <span style="
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 1px;
              padding: 2px 8px;
              border-radius: 100px;
              background: ${isCurrent ? '#2563eb' : isComplete ? '#16a34a' : '#e5e7eb'};
              color: ${isCurrent || isComplete ? '#fff' : '#999'};
            ">DAY ${dayNum}</span>
            <span style="
              font-size: 10px;
              font-weight: 600;
              letter-spacing: 0.8px;
              color: ${isCurrent ? '#2563eb' : isComplete ? '#16a34a' : '#bbb'};
            ">${isComplete ? 'COMPLETE' : isCurrent ? 'CURRENT TASK' : 'LOCKED'}</span>
          </div>

          <div style="
            font-size: 14px;
            font-weight: 600;
            color: ${isLocked ? '#bbb' : '#111'};
            line-height: 1.4;
            margin-bottom: ${isLocked ? '0' : '3px'};
          ">${s.name}</div>

          ${!isLocked ? `<div style="
            font-size: 12px;
            color: #888;
            line-height: 1.4;
          ">${s.why}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}
    </script>
  </body>
</html>
